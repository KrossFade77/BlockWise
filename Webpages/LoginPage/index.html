<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS for slider and animations -->
    <link rel="stylesheet" href="style.css">
    <!-- Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>StudyOptima - Login</title>
</head>
<body>
    <div class="container" id="app">
        <div class="bluebg">
            <div class="box signin">
                <h2>Already Have an Account?</h2>
                <button class="btn btn-light signinbtn" @click="toggleForm(false)">Sign In</button>
            </div>
            <div class="box signup">
                <h2>Don't Have an Account?</h2>
                <button class="btn btn-light signupbtn" @click="toggleForm(true)">Sign Up</button>
            </div>
        </div>
        <div class="formBx" :class="{ active: isSignup }">
            <!-- Sign In Form -->
            <div class="form signinForm">
                <form @submit.prevent="handleSignIn">
                    <i class='bx bx-log-in signinimage'></i>
                    <h3>Sign In</h3>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Username" v-model="signin.username" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Password" v-model="signin.password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <div class="mt-2">
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>
                </form>
            </div>
            <!-- Sign Up Form -->
            <div class="form signupForm">
                <form @submit.prevent="handleSignUp">
                    <i class='bx bxs-user signupimage'></i>
                    <h3>Sign Up</h3>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Username" v-model="signup.username" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email Address" v-model="signup.email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Password" v-model="signup.password" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Confirm Password" v-model="signup.confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
