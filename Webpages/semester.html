<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .form-container { max-width: 500px; margin: auto; }
        .error { color: red; display: none; }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div id="app" class="form-container">
        <h2>Semester Setup</h2>
        <form @submit.prevent="saveSemester">
            <div class="mb-3">
                <label for="startDate" class="form-label">Semester Start Date</label>
                <input type="date" class="form-control" id="startDate" v-model="semester.startDate" required>
            </div>
            <div class="mb-3">
                <label for="endDate" class="form-label">Semester End Date</label>
                <input type="date" class="form-control" id="endDate" v-model="semester.endDate" required>
            </div>
            <div class="error" :class="{ show: error }">{{ error }}</div>
            <button type="submit" class="btn btn-primary">Save Semester</button>
            <a href="dashboard.html" class="btn btn-secondary">Go to Dashboard</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.37/dist/vue.global.prod.js"></script>
    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { 
            getAuth, onAuthStateChanged 
        } 
        from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import {
            getFirestore, doc, getDoc, setDoc
        } 
        from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

        // --- Your Firebase config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBEuPV6piBqzJbl-gXZOt_YIS0F2cGIk00",
            authDomain: "testbase-ca192.firebaseapp.com",
            projectId: "testbase-ca192",
            storageBucket: "testbase-ca192.firebasestorage.app",
            messagingSenderId: "344945139722",
            appId: "1:344945139722:web:75aa2e9a5a364de11c3ff3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, "blockwise");
        const { createApp } = Vue;


        createApp({
            data() {
                return {
                    semester: {
                        startDate: '2025-08-01',
                        endDate: '2025-11-30'
                    },
                    error: ''
                };
            },
            methods: {
                async saveSemester() {
                    if (!this.semester.startDate || !this.semester.endDate) {
                        this.error = 'Please fill in both dates.';
                        return;
                    }
                    if (new Date(this.semester.endDate) < new Date(this.semester.startDate)) {
                        this.error = 'End date must be after start date.';
                        return;
                    }
                    const ref = doc(db, this.uid, "semester");
                    this.saving = true;
                    try {
                        await setDoc(ref, {
                        startDate: this.semester.startDate,
                        endDate: this.semester.endDate,
                        updatedAt: Date.now()
                        }, { merge: true });

                        console.log("[Semester] Saved to Firestore:", this.semester);
                        // Navigate after successful save (optional)
                        window.location.href = 'dashboard.html';
                    } catch (e) {
                        console.error("[Semester] Save error:", e);
                        this.error = 'Failed to save semester dates.';
                    } 
                }
            },
            mounted() {
                // if not logged in, redirect to index
                onAuthStateChanged(auth, async(user)=> {
                    if (!user) {
                        window.location.href = "index.html";
                        return;
                    }

                    this.uid = user.uid;
                    const ref = doc(db, this.uid, "semester");
                    try {
                        const snap = await getDoc(ref);
                        if (snap.exists()) {
                            const data = snap.data();
                            this.semester.startDate = data.startDate || this.semester.startDate;
                            this.semester.endDate = data.endDate || this.semester.endDate;
                            console.log("[Semester] Loaded from Firestore:", data);
                        } else {
                            console.log("[Semester] No existing doc; using defaults.");
                        }
                        } 
                    catch (e) {
                        console.error("[Semester] Load error:", e);
                        this.error = "Failed to load semester data.";
                        }
                })
            }
        }).mount('#app');
    </script>
</body>
</html>
