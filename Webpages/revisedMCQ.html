<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI MCQ Generator (Interactive)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f8f9fa;
    }
    textarea {
      width: 100%;
      margin-bottom: 15px;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .question {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin: 20px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .option {
      display: block;
      margin: 5px 0;
    }
    .result {
      font-weight: bold;
      margin-top: 8px;
    }
    .correct { color: green; }
    .wrong { color: red; }
  </style>
</head>
<body>
  <div>
    <a href="dashboard.html" class="btn btn-secondary">Back</a>
  </div>
  <h2>AI MCQ Generator</h2>
  <p>Paste your notes below. The AI will automatically create 10 MCQs (with answers) based on them.</p>

  <textarea id="notes" rows="12" cols="70"></textarea><br>
  <div style="margin: 8px 0;">
    <label for="fileInput">Upload notes (.txt / .pdf / .docx): </label>
    <input id="fileInput" type="file" accept=".txt,.pdf,.docx">
    <span id="uploadStatus" style="margin-left: 8px; color:#555;"></span>
  </div>  
  <button onclick="sendPrompt()">Generate MCQs</button>

  <h3>Generated Questions:</h3>
  <div id="quiz"></div>
  <button id="submitBtn" style="display:none;" onclick="checkAllAnswers()">Submit All</button>

  <script>
    // Use Firebase Hosting rewrites → Functions (no CORS issues)
    const API_BASE = "/api";
    const textarea = document.getElementById("notes");

    const fixedText = 
`=== Instructions (do not edit) ===
Enter your notes below. The AI will generate 10 multiple-choice questions (with answers) based on your notes.

----------------------------------
`;

    textarea.value = fixedText;

    textarea.addEventListener("input", () => {
      if (!textarea.value.startsWith(fixedText)) {
        textarea.value = fixedText + textarea.value.slice(fixedText.length);
      }
    });

    textarea.addEventListener("keydown", (e) => {
      if (textarea.selectionStart < fixedText.length &&
        ["Backspace", "ArrowUp", "ArrowLeft"].includes(e.key)) {
        e.preventDefault();
        textarea.setSelectionRange(fixedText.length, fixedText.length);
      }
    });

    textarea.addEventListener("focus", () => {
      if (textarea.selectionStart < fixedText.length) {
        textarea.setSelectionRange(fixedText.length, fixedText.length);
      }
    });
    // 'safer' file upload listener (safer + status text + append after fixedText)
    (function initUpload() {
      const fileInput = document.getElementById("fileInput");
      const statusEl  = document.getElementById("uploadStatus");
      if (!fileInput || !statusEl) return;

      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        try {
          setText(statusEl, "Uploading & extracting...");
          const extracted = await uploadFile(file);

          const current = textarea.value.startsWith(fixedText)
            ? textarea.value.slice(fixedText.length)
            : textarea.value;

          const combined = (current ? (current + "\n\n") : "") + extracted;
          textarea.value = fixedText + combined;

          // caret to end of editable area
          textarea.focus();
          const pos = fixedText.length + combined.length;
          textarea.setSelectionRange(pos, pos);

          setText(statusEl, `Loaded: ${file.name}`);
          statusEl.style.color = "#555";
        } catch (err) {
          setText(statusEl, `Error: ${err.message}`);
          statusEl.style.color = "red";
          console.error(err);
        }
      });
    })();

    function clearNode(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }
    function setText(node, text) {
      node.textContent = "";
      node.appendChild(document.createTextNode(text));
    }

    async function sendPrompt() {
      const notes = textarea.value.slice(fixedText.length).trim();
      const quizContainer = document.getElementById("quiz");
      const submitBtn = document.getElementById("submitBtn");

      clearNode(quizContainer);
      const p = document.createElement("p");
      const em = document.createElement("em");
      em.textContent = "Generating questions...";
      p.appendChild(em);
      quizContainer.appendChild(p);
      submitBtn.style.display = "none";

      // IMPORTANT: match your Cloud Function parser format exactly
      const systemInstruction = 
        "You are an educational AI. Based on the provided notes, generate 10 multiple-choice questions in this exact format:\n" +
        "**1. Question:** What is ...?\n" +
        "* A) Option 1\n" +
        "* B) Option 2\n" +
        "* C) Option 3\n" +
        "* D) Option 4\n" +
        "**Correct Answer: B) Option 2**\n\n" +
        "Repeat for 10 questions.";

      const fullPrompt = `${systemInstruction}\n\nHere are the notes:\n${notes}`;

      try {
        // 1) Ask Gemini (via Cloud Function) to generate raw MCQ text
        const genRes = await fetch(`${API_BASE}/generate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: fullPrompt })
        });
        const genData = await genRes.json();
        if (!genRes.ok) throw new Error(genData.error || `Server error: ${genRes.status}`);

        const mcqText = genData.result || "";

        // 2) Parse the MCQ text on the server into structured JSON
        const parseRes = await fetch(`${API_BASE}/parse`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mcq_text: mcqText })
        });
        const parseData = await parseRes.json();
        if (!parseRes.ok) throw new Error(parseData.error || `Server error: ${parseRes.status}`);

        const questions = parseData.questions || [];
        if (questions.length) {
          renderParsed(questions);
          submitBtn.style.display = "block";
        } else {
          clearNode(quizContainer);
          const msg = document.createElement("p");
          msg.textContent = "No questions were generated. Try again.";
          quizContainer.appendChild(msg);
        }
      } catch (err) {
        clearNode(quizContainer);
        const msg = document.createElement("p");
        msg.style.color = "red";
        msg.textContent = `Error: ${err.message}`;
        quizContainer.appendChild(msg);
        console.error(err);
      }
    }

    // Render server-parsed questions: [{ Question, Options[], Correct }]
    function renderParsed(questions) {
      const quizContainer = document.getElementById("quiz");
      clearNode(quizContainer);

      questions.forEach((qObj, i) => {
        const qDiv = document.createElement("div");
        qDiv.className = "question";

        // Title line: <p><strong>Q1.</strong> Question text</p>
        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = `Q${i + 1}.`;
        p.appendChild(strong);
        p.appendChild(document.createTextNode(" " + (qObj.Question || "")));
        qDiv.appendChild(p);

        const opts = (qObj.Options || []).slice(0, 4);
        // Determine the correct LETTER (A/B/C/D) by matching Correct text to an option
        let correctLetter = "";
        const optionHtml = opts.map((opt, j) => {
          const letter = "ABCD"[j];
          if (!correctLetter && qObj.Correct && opt.trim() === qObj.Correct.trim()) {
            correctLetter = letter;
          }
          // <label class="option"><input ...> A) text</label>
          const label = document.createElement("label");
          label.className = "option";
          const input = document.createElement("input");
          input.type = "radio";
          input.name = `q${i + 1}`;
          input.value = letter;
          label.appendChild(input);
          label.appendChild(document.createTextNode(` ${letter}) ${opt}`));
          qDiv.appendChild(label);
        });

        qDiv.dataset.correctLetter = correctLetter || ""; // fallback empty if parser couldn't match
        const result = document.createElement("div");
        result.className = "result";
        result.id = `result${i + 1}`;
        qDiv.appendChild(result);
        quizContainer.appendChild(qDiv);
      });
    }

    function checkAllAnswers() {
      const questions = document.querySelectorAll(".question");
      questions.forEach((q) => {
        const selected = q.querySelector("input[type='radio']:checked");
        const correctLetter = (q.dataset.correctLetter || "").toUpperCase();
        const resultDiv = q.querySelector(".result");

        if (!selected) {
          resultDiv.textContent = "⚠️ Please select an option.";
          resultDiv.className = "result wrong";
        } else if (correctLetter && selected.value.toUpperCase() === correctLetter) {
          resultDiv.textContent = "✅ Correct!";
          resultDiv.className = "result correct";
        } else if (correctLetter) {
          resultDiv.textContent = `❌ Wrong! Correct answer: ${correctLetter}`;
          resultDiv.className = "result wrong";
        } else {
          // If the server didn't return a matchable correct option, inform the user.
          resultDiv.textContent = "ℹ️ Correct answer unavailable for this item.";
          resultDiv.className = "result";
        }
      });
    }
    async function uploadFile(file) {
      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch("/api/upload", {
        method: "POST",
        body: formData,
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Upload failed");
      return data.text;

      // After submitting quiz, mark all nudges as completed
      try {
        localStorage.setItem('quizTaken', 'true');
      } catch (e) {
        console.warn('Could not save quizTaken flag:', e);
      }
    }


  </script>
</body>
</html>
